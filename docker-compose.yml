name: clipmind

services:
  backend:
    build:
      context: ./backend
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
      PROVIDER: ${PROVIDER:-mock}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_ASR_MODEL: ${META_ASR_MODEL:-muse-voice-transcribe-1.0}
      USE_META_ASR: ${USE_META_ASR:-true}
      MAX_BUDGET_USD: ${MAX_BUDGET_USD:-100}
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/clipmind.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      AUTO_RESUME_JOBS: "true"
    ports:
      - "8000:8000"
    volumes:
      - clipmind-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clipmind-data:
