[project]
name = "clipmind-backend"
version = "0.1.0"
description = "ClipMind multimodal content intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.30,<2.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "black>=24.10.0",
]
whisper = [
  "faster-whisper>=1.1.0",
]
opencv = [
  "opencv-python-headless>=4.10.0",
]
scenes = [
  "scenedetect>=0.6.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["samples", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.setuptools.packages.find]
include = ["app*"]
